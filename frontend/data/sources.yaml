    note:
      cs: "Incidence na 100 000 obyvatel jsou odvozené údaje portálu, ne oficiální statistika ČSÚ."
      en: "Incidence per 100,000 population is data derived by the portal, not official ČSÚ statistics."
    verified: "2026-10-25"
  format: { cs: "CSV (DataStat API, sada PORKR01)", en: "CSV (DataStat API, dataset PORKR01)" }
  coverage: "2000–2025"
  grain: { cs: "rok × kraj × pohlaví", en: "year × region × sex" }
  frequency: { cs: "ročně", en: "annual" }

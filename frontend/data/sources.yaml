# Catalogue of the portal's data sources — the one place that records where
# each dataset comes from.
#
# Read by the {{< data-catalogue >}} shortcode (About → Data and licences page):
# it renders a human-readable overview and schema.org/DataCatalog (JSON-LD).
#
# Rules:
#   - Write `licence.name` as the SOURCE states it. If the source states none,
#     say so ("neuvedena") — an assumed licence is worse than an admitted gap.
#     `licence.note` = conditions the name does not carry (what to credit, how
#     to mark modifications, what is forbidden); `licence.verified` = the day
#     the terms were read on the linked page. The technical twin of this record
#     is pathogensportal-db/sources.yaml — keep the licence the same on both.
#   - `citation` = the citation / attribution sentence the source asks for,
#     verbatim (plain text when the source gives it in one language only).
#   - Text shown on the page (`publisher`, `licence.name`, `format`, …) is a
#     { cs, en } pair; plain text is allowed only when it reads the same in both
#     languages ("WHO", "CSV").
#   - `pages` are paths of the pages that use the source. The shortcode links
#     only to pages that exist, so a source may be added before its dashboard.
#   - `limits` = what the data CANNOT tell you. Required, not decorative.
#   - Order = order on the page: Czech surveillance first, then context.

- id: uzis-isin
  name: { cs: "Infekční nemoci v ČR (ISIN)", en: "Infectious diseases in Czechia (ISIN)" }
  publisher: { cs: "ÚZIS ČR", en: "ÚZIS CZ" }
  url: "https://www.nzip.cz/data/2621-infekcni-nemoci-otevrena-data"
  download: "https://datanzis.uzis.gov.cz/data/NR-27-ISIN/NR-27-01/Otevrena-data-NR-27-01-infekcni-nemoci.csv"
  licence:
    name: "CC BY 4.0"
    url: "https://creativecommons.org/licenses/by/4.0/"
    note:
      cs: "Při dalším užití uveďte doporučenou citaci ÚZIS ČR."
      en: "When reusing the data, give the citation recommended by ÚZIS ČR."
    verified: "2026-10-25"
  citation: "Šanca O., Májek T., Davidová H., Rázková K., Klimeš D., Kubát J., Blaha M., Jarkovský J.. Infekční nemoci v ČR. Národní zdravotnický informační portál [online]. Praha: Ministerstvo zdravotnictví ČR a Ústav zdravotnických informací a statistiky ČR, 2026. Dostupné z: http://www.nzip.cz/data/2621-infekcni-nemoci-otevrena-data. ISSN 2695-0340"
  format: "CSV + CSVW metadata"
  coverage: "2018–2025"
  grain: { cs: "měsíc × kraj × diagnóza MKN-10 × věk × pohlaví", en: "month × region × ICD-10 diagnosis × age × sex" }
  frequency: { cs: "ročně (soubor z ledna 2026 končí prosincem 2025)", en: "annual (the January 2026 file ends in December 2025)" }
  limits:
    cs: "Neobsahuje COVID-19, tuberkulózu, syfilis, kapavku ani HIV — mají vlastní registry. Od července 2025 přichází část případů novým kanálem hlášení (EWS), řady proto nejsou přes tento zlom přímo srovnatelné."
    en: "Does not include COVID-19, tuberculosis, syphilis, gonorrhoea or HIV — these have their own registers. Since July 2025 some cases arrive through a new reporting channel (EWS), so series are not directly comparable across that break."
  # The seven topic pages all use this dataset (isin_group_* charts); listing
  # them here gives them a source link and page-level structured data.
  pages: ["/dashboards/infectious-diseases", "/signals",
          "/dashboards/infectious-diseases-childhood",
          "/dashboards/infectious-diseases-gastro",
          "/dashboards/infectious-diseases-hepatitis",
          "/dashboards/infectious-diseases-rare",
          "/dashboards/infectious-diseases-skin",
          "/dashboards/infectious-diseases-vector",
          "/dashboards/infectious-diseases-other"]


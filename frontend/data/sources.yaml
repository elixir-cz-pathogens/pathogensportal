    url: "https://creativecommons.org/licenses/by/4.0/"
    note:
      cs: "Při dalším užití uveďte doporučenou citaci ÚZIS ČR."
      en: "When reusing the data, give the citation recommended by ÚZIS ČR."
    verified: "2026-10-25"
  citation: "Májek T., Bartůněk V., Jarkovský J.. Pohlavní nemoci v ČR. Národní zdravotnický informační portál [online]. Praha: Ministerstvo zdravotnictví ČR a Ústav zdravotnických informací a statistiky ČR, 2026. Dostupné z: http://www.nzip.cz/data/2639-pohlavni-nemoci-otevrena-data. ISSN 2695-0340"

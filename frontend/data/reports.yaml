# Multi-page situational reports.
#
# The report is NOT generated by the portal — an external generator (AI with
# human review) delivers it as finished static HTML. `tools/ingest_report.py`
# extracts <main>, sanitizes it and writes it to `content/cs/dashboards/`.
#
# This file maps what the generator delivers (`source`) to the portal URL
# (`url`), so URLs stay stable even if the generator renames its files. The
# `section-nav` and `report-cards` shortcodes also build the navigation between
# sections from it.
#
# Section content files are generated — do not edit them by hand, the ingest
# overwrites them.

ebola:
  title: "Ebola BDBV 2026"
  source_dir: "incoming/ebola"

  # Front matter shared by all report sections; values present in the HTML
  # (title, description, verification date) are overridden by the ingest.
  defaults:
    image: "/images/dashboard-placeholder.svg"
    tags: ["ebola", "epidemiologie", "IMG AV ČR", "Afrika"]
    data_source: 'Jan Pačes & Michaela Liegertová — <a href="https://www.img.cas.cz" target="_blank">IMG AV ČR</a> · Licence CC BY 4.0'
    update_freq: "Průběžně (aktivní vypuknutí)"

  sections:
    - url: /dashboards/ebola-bundibugyo-2026/
      source: index.html
      name: "Aktuální stav"
      desc: "Shrnutí situace, datované údaje podle jednotlivých zdrojů a časová osa zásadních událostí."
      # The only section shown in the dashboard list — the rest are report subpages.
      listed: true
      highlight: true

    - url: /dashboards/ebola-cesko/
      source: cesko.html
      name: "Český kontext"
      desc: "Riziko pro veřejnost, FN Bulovka, cestovatelé, zdravotníci a české oficiální i podpůrné zdroje na jednom místě."

    - url: /dashboards/ebola-virus/
      source: virus.html
      name: "Ebolaviry"
      desc: "Obecně ebolaviry, rozdíl mezi virem Ebola a virem Bundibugyo, přenos, diagnostika a sekvenování."

    - url: /dashboards/ebola-lecba-vakciny/
      source: lecba-vakciny.html
      name: "Léčba a vakcíny"
      desc: "Co je schválené pro virus Ebola, co zatím chybí pro Bundibugyo a co se zkouší."

    - url: /dashboards/ebola-predchozi-epidemie/
      source: predchozi-epidemie.html
      name: "Minulé epidemie"
      desc: "Západní Afrika 2014–2016 a Severní Kivu/Ituri 2018–2020 jako hlavní poučení pro rok 2026."

    - url: /dashboards/ebola-dezinformace/
      source: dezinformace.html
      name: "Dezinformace"
      desc: "Opakující se narativy, český kontext a rychlé odpovědi k FN Bulovka, Těchonínu a Berlínu."

    - url: /dashboards/ebola-zdroje/
      source: zdroje.html
      name: "Zdroje"
      desc: "Oficiální, české, odborné, mediální a další zdroje rozdělené podle typu."

    - url: /dashboards/ebola-graf-vyvoj/
      source: graf-vyvoj.html
      name: "Graf vývoje"
      desc: "Denní řada DRK, kumulativní úmrtí, tabulka hodnot a data ke stažení."

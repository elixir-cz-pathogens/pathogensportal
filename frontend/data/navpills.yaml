# Navigační „pilulky“ dashboardových skupin — JEDINÝ zdroj pravdy.
# Dřív byl tenhle seznam vkopírovaný v každé stránce skupiny zvlášť (11 kopií),
# takže přidání stránky znamenalo editovat všechny — a kopie se rozcházely
# (stránka Signály se do žádné nepropsala). Renderuje shortcode nav-pills:
#   {{< nav-pills group="infekcni-nemoci" active="gastro" >}}
# URL jsou bez jazykového prefixu — shortcode je žene přes relLangURL, takže
# tatáž definice slouží české i anglické verzi.

infekcni-nemoci:

baseURL = "https://pathogens.vm.cesnet.cz/"
title = "Pathogen Portal CZ"
theme = "hugo-pathogens-portal"
defaultContentLanguage = "cs"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[params]
  mail = "hpaces@img.cas.cz"
  # Výchozí náhledový obrázek pro sdílení (og:image / twitter:image)
  # Jmeno souboru nese datum verze schválně: Discord a spol. cachují náhledy
  # podle URL obrázku a neumí je obnovit — při změně obrázku soubor přejmenuj.
  images = ["/images/og-card-2026-09.png"]
  homepage = "https://pathogens.vm.cesnet.cz"
  logo = "/images/elixir_logo.png"
  # Base URL of the charts API. Empty = same origin (production: the Apache proxy).
  # The dev server runs on a different port from the BE -> compose sets HUGO_PARAMS_APIBASE.
  # No underscore, deliberately: Hugo treats `_` in an env variable name as a level
  # separator, so HUGO_PARAMS_API_BASE would become params.api.base.
  apibase = ""

  # ── Visitor statistics ─────────────────────────────────────────────────────
  # Self-hosted Umami. The tracker is emitted only when website_id is non-empty
  # (see layouts/partials/head.html), so leaving it blank ships no tracker —
  # which is the correct state for a local build and for any environment where
  # this has not been decided.
  #
  # ⛔ The id is created in the Umami UI (SSH tunnel, it is not public) and is not
  # a secret — it appears in the page source of every visitor. What IS sensitive
  # is the Umami login, which is not here and never should be.
  [params.analytics]
    website_id = ""
    # Same-origin path served by the Apache /stats/ proxy. A third-party host
    # here would be blocked by ad blockers and would defeat the point.
    script_url = "/stats/script.js"

[languages]
  [languages.cs]
    title = "Pathogen Portal CZ"
    weight = 1
    label = "Čeština"
    locale = "cs-CZ"
    contentDir = "content/cs"
    # Menu jsou per-jazyk — globální [menus] by anglické verzi podstrčilo
    # české názvy položek.
    [[languages.cs.menus.main]]
      identifier = "dashboards"
      name = "Dashboardy"
      url = "/dashboards/"
      weight = 10
    [[languages.cs.menus.main]]
      identifier = "news"
      name = "Novinky"
      url = "/news/"
      weight = 20
    # Akce jsou z menu schované, dokud sekce nemá obsah — /events/ zůstává
    # dostupné přes URL. Až bude první akce, stačí blok odkomentovat.
    # [[languages.cs.menus.main]]
    #   identifier = "events"
    #   name = "Akce"
    #   url = "/events/"
    #   weight = 30

  [languages.en]
    title = "Pathogen Portal CZ"
    weight = 2
    label = "English"
    locale = "en-GB"
    contentDir = "content/en"
    [[languages.en.menus.main]]
      identifier = "dashboards"
      name = "Dashboards"
      url = "/dashboards/"
      weight = 10
    [[languages.en.menus.main]]
      identifier = "news"
      name = "News"
      url = "/news/"
      weight = 20

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# ── Security policy ──────────────────────────────────────────────────────────
# Hugo >= 0.164 blocks `text/html` content files by default
# (`security.allowContent` defaults to ['! ^text/html$']). We deliberately need
# them: tools/ingest_report.py writes generated situational-report pages as .html
# into content/cs/dashboards/, because the report comes from an external
# generator as finished HTML.
#
# This is safe *because* the ingest sanitizes every delivery against an explicit
# tag/attribute allowlist before it is written — see ALLOWED_TAGS / ALLOWED_ATTRS
# in tools/ingest_report.py. Foreign <script>/<style>/<iframe> never reach here.
#
# The list is narrow on purpose: adding another content format means adding it
# here too, which is the point — it should be a deliberate act, not a default.
[security]
  allowContent = ['^text/markdown$', '^text/html$']

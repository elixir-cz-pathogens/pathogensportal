baseURL = "https://pathogens.vm.cesnet.cz/"
title = "Pathogen Portal CZ"
theme = "hugo-pathogens-portal"
defaultContentLanguage = "cs"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[params]
  mail = "vlasakj@vscht.cz"
  homepage = "https://pathogens.vm.cesnet.cz"
  logo = "/images/elixir_logo.png"
  # Base URL of the charts API. Empty = same origin (production: the Apache proxy).
  # The dev server runs on a different port from the BE -> compose sets HUGO_PARAMS_APIBASE.
  # No underscore, deliberately: Hugo treats `_` in an env variable name as a level
  # separator, so HUGO_PARAMS_API_BASE would become params.api.base.
  apibase = ""

[languages]
  [languages.cs]
    title = "Pathogen Portal CZ"
    weight = 1
    label = "Čeština"
    locale = "cs-CZ"
    contentDir = "content/cs"
    # ⛔ Menus are per-language AND use `pageRef`, not `url`. Both halves are
    # needed and each was measured on a real build, because the failure is silent
    # — the link works, it just lands on the wrong language:
    #
    #   global [menus] + url        → EN nav points at /news/       (Czech page)
    #   per-language menus + url    → EN nav points at /news/       (still Czech!)
    #   per-language menus + pageRef → EN nav points at /en/news/   ✅
    #
    # A menu entry's `url` is emitted verbatim; Hugo does not prefix it with the
    # language even when the entry is declared inside [languages.en]. `pageRef`
    # resolves against the language's own content tree, which is what we want.
    # ⚠️ The labels below are the ones production already shows. They are English
    # words on a Czech site, which is odd, but renaming them is a content decision
    # (PP-39) — done here it would ship silently inside an infrastructure PR.
    [[languages.cs.menus.main]]
      identifier = "dashboards"
      name = "Data Dashboards"
      pageRef = "/dashboards"
      weight = 10
    [[languages.cs.menus.main]]
      identifier = "news"
      name = "News"
      pageRef = "/news"
      weight = 20
    [[languages.cs.menus.main]]
      identifier = "events"
      name = "Events"
      pageRef = "/events"
      weight = 30

  [languages.en]
    title = "Pathogen Portal CZ"
    weight = 2
    label = "English"
    locale = "en-GB"
    contentDir = "content/en"
    [[languages.en.menus.main]]
      identifier = "dashboards"
      name = "Data Dashboards"
      pageRef = "/dashboards"
      weight = 10
    [[languages.en.menus.main]]
      identifier = "news"
      name = "News"
      pageRef = "/news"
      weight = 20
    [[languages.en.menus.main]]
      identifier = "events"
      name = "Events"
      pageRef = "/events"
      weight = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# ── Security policy ──────────────────────────────────────────────────────────
# Hugo >= 0.164 blocks `text/html` content files by default
# (`security.allowContent` defaults to ['! ^text/html$']). We deliberately need
# them: the Ebola situational-report pages arrive from an external generator as
# finished HTML and are committed straight into content/{cs,en}/dashboards/.
#
# ⚠️ WHERE THE SAFETY COMES FROM CHANGED ON 4 SEP 2026. This block used to say
# the permission was safe because tools/ingest_report.py sanitized every delivery
# against an allowlist before writing it. That was true while the ingest was in
# the path; since the AI content flow opens a PR directly (first one merged as
# #49, 4 Sep) the ingest is NOT in the path, and the permission was left standing
# on a justification that no longer applied.
#
# The allowlist now runs in CI instead — .github/workflows/check-content-sanitizer.yaml
# scans the whole content tree on every PR into main and is a required check.
# It is deliberately a mirror of ALLOWED_TAGS / ALLOWED_ATTRS in ingest_report.py:
# if a tag is added to one, add it to the other in the same PR.
#
# The list is narrow on purpose: adding another content format means adding it
# here too, which is the point — it should be a deliberate act, not a default.
[security]
  allowContent = ['^text/markdown$', '^text/html$']

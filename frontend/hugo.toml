baseURL = "https://pathogens.vm.cesnet.cz/"
title = "Pathogen Portal CZ"
theme = "hugo-pathogens-portal"
defaultContentLanguage = "cs"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

# Source of .Lastmod, which the home page uses to order cards. Without it
# .Lastmod is zero for every dashboard (none has `date:` in its front matter),
# and ordering by modification date would silently return an arbitrary order.
#
# Requires FULL history at build time: the deploy and preview workflows use
# `fetch-depth: 0`. On a shallow clone every file gets the date of the single
# commit and the ordering collapses to one date.
enableGitInfo = true

# Front matter `lastmod` and `date` take precedence over git. Hugo puts :git
# first by default, but here the git date does not mean "content changed":
# bulk merges touch many files at once, and the data pipeline commits into
# content/ itself, so git dates mix text edits with automated runs.
#
# With this order, adding `date:` to a dashboard's front matter overrides the
# result. Git remains the fallback for pages without a date.
[frontmatter]
  lastmod = ['lastmod', 'date', ':git', ':default']

# JSON-LD is not a built-in Hugo media type — without this definition Hugo
# could not determine the content type of the DCAT catalogue files
# (layouts/partials/dcat-publish.html).
[mediaTypes]
  [mediaTypes."application/ld+json"]
    suffixes = ["jsonld"]

# Two machine-readable outputs of the "Data and citation" page. They are enabled
# in that page's front matter via `outputs`, not globally — otherwise Hugo would
# generate them for every page on the site.
[outputFormats]
  # Source catalogue for readers and machines — /about/data/sources.json. Emits
  # the whole of data/sources.yaml including `limits` (what the data CANNOT tell
  # you), which fits neither schema.org nor DCAT but matters most to data users.
  [outputFormats.sources]
    mediaType = "application/json"
    baseName = "sources"
    isPlainText = true
    # Must not be announced as an alternate of the page: `<link rel=alternate>`
    # would present the catalogue as another form of the same document, which it is not.
    notAlternative = true

[params]
  mail = "hpaces@img.cas.cz"
  # Before registering the catalogue in NKOD (National Open Data Catalogue),
  # set this to the publisher IRI from the Register of Rights and Obligations:
  #   https://rpp-opendata.egon.gov.cz/odrpp/zdroj/orgán-veřejné-moci/<IČO>
  # While empty, the catalogue is still generated as plain DCAT (usable on its
  # own), but NKOD harvesting rejects it — `poskytovatel` is mandatory.
  [params.dcat]
    publisher = ""
  # Default preview image for sharing (og:image / twitter:image).
  # The file name carries a version date on purpose: Discord and similar services
  # cache previews by image URL and cannot refresh them — rename the file when
  # the image changes.
  images = ["/images/og-card-2026-09.png"]
  homepage = "https://pathogens.vm.cesnet.cz"
  logo = "/images/elixir_logo.png"
  # Base URL of the charts API. Empty = same origin (production: the Apache proxy).
  # The dev server runs on a different port from the BE -> compose sets HUGO_PARAMS_APIBASE.
  # No underscore, deliberately: Hugo treats `_` in an env variable name as a level
  # separator, so HUGO_PARAMS_API_BASE would become params.api.base.
  apibase = ""

  # ── Visitor statistics ─────────────────────────────────────────────────────
  # Self-hosted Umami. The tracker is emitted only when website_id is non-empty
  # (see layouts/partials/head.html), so leaving it blank ships no tracker —
  # which is the correct state for a local build and for any environment where
  # this has not been decided.
  #
  # The id is created in the Umami UI (reached via SSH tunnel, not public) and is
  # not a secret — it appears in the page source for every visitor. The Umami
  # login is sensitive and must never be stored here.
  [params.analytics]
    # Same-origin path served by the Apache /stats/ proxy. A third-party host
    # here would be blocked by ad blockers and would defeat the point.
    script_url = "/stats/script.js"

    # ── One id per machine, keyed by the host it belongs to ──────────────────
    # Each machine runs its own Umami with its own database, so an id is only
    # meaningful on the machine that issued it. The build picks the entry
    # matching the host it is building for — `baseURL` comes from STAGING_HOST /
    # PRODUCTION_HOST at deploy time — and emits nothing when there is no match.
    #
    # This keeps the file identical on `dev` and `main`, enforced by the build
    # rather than by convention. A host with no entry (a local build, a PR
    # preview, a new machine) ships no tracker rather than a wrong one; sending
    # production traffic to the staging id would produce plausible but wrong
    # numbers.
    #
    # Must stay the LAST entry in [params.analytics]: a TOML sub-table header
    # captures every key after it, so a plain key added below would land in here.
    [params.analytics.hosts]
      "pathogens-dev.vm.cesnet.cz" = "d1dc6fc0-e043-4089-b4f5-ebdad26e9f88"
      "pathogens.vm.cesnet.cz" = "368bbdc4-e019-4134-add7-d6b5a1bd6e9f"

# Menu entries use `pageRef`, never `url`. A menu entry's `url` is emitted
# verbatim and Hugo does not prefix it with the language, even inside
# [languages.en], so English menu links would point to Czech pages.
[languages]
  [languages.cs]
    title = "Pathogen Portal CZ"
    weight = 1
    label = "Čeština"
    locale = "cs-CZ"
    contentDir = "content/cs"
    # Menus are defined per language — a global [menus] would give the English
    # version Czech item names.
    # There is no "Home" item: the portal logo links to the home page.
    [[languages.cs.menus.main]]
      identifier = "dashboards"
      name = "Dashboardy"
      pageRef = "/dashboards"
      weight = 10
    # Signals must stay in the menu: the page is not part of the dashboards
    # section and has no home-page tile, so this is its only navigation path.
    [[languages.cs.menus.main]]
      identifier = "signals"
      name = "Signály"
      pageRef = "/signals"
      weight = 15
    [[languages.cs.menus.main]]
      identifier = "news"
      name = "Novinky"
      pageRef = "/news"
      weight = 20
    # Events are intentionally not in the menu: they are a section of the home
    # page (calendar + list) and /events/ is not rendered
    # (content/*/events/_index.md → build.render: never), so an item would 404.

  [languages.en]
    title = "Pathogen Portal CZ"
    weight = 2
    label = "English"
    locale = "en-GB"
    contentDir = "content/en"
    # There is no "Home" item: the portal logo links to the home page.
    [[languages.en.menus.main]]
      identifier = "dashboards"
      name = "Dashboards"
      pageRef = "/dashboards"
      weight = 10
    # Signals must stay in the menu: the page is not part of the dashboards
    # section and has no home-page tile, so this is its only navigation path.
    [[languages.en.menus.main]]
      identifier = "signals"
      name = "Signals"
      pageRef = "/signals"
      weight = 15
    [[languages.en.menus.main]]
      identifier = "news"
      name = "News"
      pageRef = "/news"
      weight = 20

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# ── Security policy ──────────────────────────────────────────────────────────
# Hugo >= 0.164 blocks `text/html` content files by default
# (`security.allowContent` defaults to ['! ^text/html$']). We deliberately need
# them: tools/ingest_report.py writes generated situational-report pages as .html
# into content/cs/dashboards/, because the report comes from an external
# generator as finished HTML.
#
# This is safe *because* the ingest sanitizes every delivery against an explicit
# tag/attribute allowlist before it is written — see ALLOWED_TAGS / ALLOWED_ATTRS
# in tools/ingest_report.py. Foreign <script>/<style>/<iframe> never reach here.
#
# The list is narrow on purpose: adding another content format means adding it
# here too, which is the point — it should be a deliberate act, not a default.
[security]
  allowContent = ['^text/markdown$', '^text/html$']

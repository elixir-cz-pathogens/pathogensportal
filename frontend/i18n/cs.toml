# Přepisy českých řetězců theme (Hugo slučuje site-level i18n přes theme).
# Theme překlad je strojový („Řídicí panely“ = palubní desky) a jeden klíč má
# špatnou velikost písmene: index.html volá `i18n "dashboards"`, slovník theme
# zná jen [Dashboards] — nadpis sekce na homepage se proto renderoval prázdný.


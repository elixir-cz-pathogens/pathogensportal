# Overrides of the theme's Czech strings (Hugo merges site-level i18n over the
# theme). The theme translation is machine-made, and one key has the wrong case:
# index.html calls `i18n "dashboards"` while the theme dictionary only has
# [Dashboards], so the home-page section heading would render empty.

[dashboards]
other = "Dashboardy"

[Dashboards]
other = "Dashboardy"

[seeDashboards]
other = "Zobrazit všechny dashboardy"

[allDashboards]
other = "Všechny dashboardy"

[dataDashboards]
other = "Dashboardy"

[newsAndHighlights]

name: pathogensportal

# The production stack. The FE (Hugo) is served by Apache on the host — there is no container for it.
# The services listen on the internal network only; everything goes out through the Apache reverse proxy.
# Nothing is published to the host (no ports:) — the DB is not reachable from outside.

services:
  website-be:
    build: ../backend/website-be
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: pathogen-db
    volumes:
      # Vstup pro ETL `python -m app.loader` (chart JSON -> Postgres). Read-only.
      - ../frontend/static/data/charts:/charts:ro
    depends_on:
      pathogen-db:
        condition: service_healthy
    networks: [internal]

  llm-agent-be:
    build: ../backend/llm-agent-be
    restart: unless-stopped
    env_file: [.env]
    networks: [internal]

  mcp:
    build: ../backend/mcp
    restart: unless-stopped
    env_file: [.env]
    networks: [internal]

  pathogen-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # the schema from the pathogensportal-db submodule
      - ../pathogensportal-db/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [internal]

  # The data pipeline from the pathogensportal-db submodule.
  # It does not run continuously — it is started on demand / from cron:
  #   docker compose --profile tools run --rm datascrapper
  datascrapper:
    profiles: ["tools"]
    build: ../pathogensportal-db
    environment:
      DATA_DIR: /data
      OUTPUT_DIR: /output/charts
      CONTENT_DIR: /output/content
    volumes:
      - scraped-data:/data
      # the generated chart JSON and Ebola content pages go straight into the
      # frontend (Model A: both are committed). Content is Czech (process_ebola.py).
      - ../frontend/static/data/charts:/output/charts
      - ../frontend/content/cs/dashboards:/output/content
    networks: [internal]

volumes:
  pgdata:
  scraped-data:

networks:
  internal:

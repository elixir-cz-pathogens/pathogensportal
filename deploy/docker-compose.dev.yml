name: pathogensportal

# Dev override — use it together with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Adds the Hugo dev server, publishes ports on localhost only, and enables BE hot reload.

services:
  hugo:
    image: hugomods/hugo:exts
    volumes:
      - ../frontend:/src
    ports:
      - "127.0.0.1:1313:1313"
    environment:
      # The dev server runs on :1313 and the API on :8000 — a different origin, so the
      # frontend needs an absolute URL. In production both sit behind the same Apache and
      # the param stays empty (see hugo.toml → params.api_base).
      HUGO_PARAMS_APIBASE: http://localhost:8000
    command: server --bind 0.0.0.0 --baseURL http://localhost:1313/ --disableFastRender

  website-be:
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ../backend/website-be/app:/app/app
      # Input for `python -m app.loader` — the same directory the datascrapper
      # generates into. Read-only: the loader only reads from it.
      - ../frontend/static/data/charts:/charts:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  llm-agent-be:
    ports: ["127.0.0.1:8001:8001"]
    volumes:
      - ../backend/llm-agent-be/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  mcp:
    ports: ["127.0.0.1:8002:8002"]
    volumes:
      - ../backend/mcp/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

  pathogen-db:
    ports: ["127.0.0.1:5432:5432"]

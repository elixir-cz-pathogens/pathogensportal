name: "CHECK: External links"

# Weekly check of the links on the linked-out dashboards (Nextstrain, SZÚ
# wastewater, …) — TODO I24. The logic is tools/check_external_links.py; run it
# locally the same way.
#
# A failing scheduled run notifies almost nobody, so the result is an ISSUE:
# opened (or updated) when a link breaks, closed when all links answer again.
#
# ⚠️ `schedule` and `workflow_dispatch` only run from the DEFAULT branch, so this
# starts working once it is on `main` (with the next release).

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links
        id: check
        run: |
          set +e
          python tools/check_external_links.py --markdown > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Broken external links on linked-out dashboards"
        run: |
          gh label create link-check --color d93f0b --description "Opened by check-external-links.yaml" 2>/dev/null || true
          number=$(gh issue list --label link-check --state open --json number -q '.[0].number')
          if [ "${{ steps.check.outputs.status }}" != "0" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file report.md
            else
              gh issue create --title "$TITLE" --label link-check --body-file report.md
            fi
            exit 1
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "All external links answer again (run ${{ github.run_id }})."
          fi

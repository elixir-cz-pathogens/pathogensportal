# ─────────────────────────────────────────────────────────────────────────────
#  Preview for generated content PRs
#
#  A reviewer checking generated public-health text has to read the rendered
#  page; a Markdown diff across several files invites checking syntax instead of
#  claims.
#
#  The PR is identified by its head branch, not by `paths:`. A path filter on
#  content/ or charts/ would also fire on the `dev` → `main` release PR, which
#  carries the data pipeline's commits and touches the same paths.
#      content/…              generated content → preview + content review  (this file)
#      no-issue/release-data  release data run  → ordinary release PR
#      feature|bugfix|docs/…  people            → ordinary PR
#
#  When CONTENT_AUTHOR is set, the PR author is checked too: a branch name can
#  match by accident, an identity cannot.
# ─────────────────────────────────────────────────────────────────────────────
name: "Preview: content PR"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# cancel-in-progress is true here and deliberately false in the deploy
# workflows: a deploy must finish its transfer, whereas a superseded preview is
# simply replaced by the newer one.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: >-
      startsWith(github.head_ref, 'content/') &&
      (vars.CONTENT_AUTHOR == '' || github.event.pull_request.user.login == vars.CONTENT_AUTHOR)
    runs-on: ubuntu-latest
    steps:
      - name: Check the deploy target is configured
        run: |
          test -n "${{ vars.STAGING_HOST }}" || { echo "::error::Missing STAGING_HOST."; exit 1; }
          test -n "${{ vars.STAGING_SSH_HOST_KEY }}" || { echo "::error::Missing STAGING_SSH_HOST_KEY."; exit 1; }

      - uses: actions/checkout@v5
        with:
          submodules: recursive   # the Hugo THEME is a submodule; without it the site builds bare
          # Full history, because hugo.toml sets enableGitInfo: .Lastmod is the
          # last commit that touched each file, and the homepage orders the
          # dashboard cards by it. On a shallow clone every file gets the same
          # date and the preview would show a different order than the deploy.
          fetch-depth: 0

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned, and kept in step with the servers and the other workflows,
          # so the build does not change when a new Hugo release appears.
          hugo-version: '0.164.0'
          extended: true

      # --baseURL is required. hugo.toml sets the production URL, so a preview
      # built without it would emit absolute links back to the live site, and the
      # reviewer could end up reading production's copy of a page.
      - name: Build the preview
        working-directory: frontend
        run: |
          hugo --minify --baseURL "https://${{ vars.STAGING_HOST }}/preview/pr-${{ github.event.pull_request.number }}/"

      - name: Publish it
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "${{ vars.STAGING_HOST }}" "${{ vars.STAGING_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          # No new credential: the previews directory sits inside the rrsync jail
          #    the staging deploy key can already write to.
          # --delete is scoped to this PR's own directory, so it can never touch
          #    a release or the live symlink.
          rsync -rlvz --delete --no-perms --no-owner --no-group --omit-dir-times \
            -e "ssh -o StrictHostKeyChecking=yes" \
            frontend/public/ \
            "${{ vars.DEPLOY_USER }}@${{ vars.STAGING_HOST }}:${{ vars.STAGING_PATH }}previews/pr-${{ github.event.pull_request.number }}/"

      - name: Tell the reviewer where to look
        env:
          GH_TOKEN: ${{ github.token }}
          URL: "https://${{ vars.STAGING_HOST }}/preview/pr-${{ github.event.pull_request.number }}/"
        run: |
          BODY="🔍 **Náhled k revizi:** $URL

          Otevři odkaz a **přečti si stránky tak, jak budou publikované** — ne diff.
          Kontroluje se věcná správnost textu (čísla, data, tvrzení), ne formátování.

          Když je to v pořádku: **Files changed → Review changes → Approve**, pak **Merge**.
          Po mergi se to nasadí na produkci samo, zhruba do dvou minut.

          ⚠️ Náhled se přepíše při každé další změně v tomto PR."
          # One comment, updated in place — a new comment per push buries the link.
          # The id must come from the REST endpoint. `gh pr view --json comments`
          # returns the GraphQL node id (IC_kwDO…), and PATCHing
          # /issues/comments/<node-id> returns 404.
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" \
                 --jq '.[] | select(.body|startswith("🔍 **Náhled")) | .id' | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -f body="$BODY" >/dev/null
          else
            gh pr comment ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --body "$BODY"
          fi

      # Skipped, not failed, when CONTENT_REVIEWER is unset; a missing reviewer
      # should produce a warning rather than a failed workflow.
      - name: Request the content reviewer
        if: vars.CONTENT_REVIEWER != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" \
            --add-reviewer "${{ vars.CONTENT_REVIEWER }}" \
          || echo "::warning::Could not request ${{ vars.CONTENT_REVIEWER }} — is the account in the org with write access?"

      - name: Say so when there is no reviewer configured
        if: vars.CONTENT_REVIEWER == ''
        run: echo "::warning::CONTENT_REVIEWER is not set, so no reviewer was requested. Set the repo variable to the content reviewer's GitHub account."

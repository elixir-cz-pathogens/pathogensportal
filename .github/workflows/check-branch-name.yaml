name: "CHECK: Branch Naming"

# Source branch name check — ONLY on PRs into `main`.
# Valid:  (feature|bugfix|docs)/<PREFIX>-<number>_description  |  starting with <IGNORE_PREFIX>  |  dev
on:
  pull_request:
    branches: [main]

jobs:
  branch-name-check:
    runs-on: ubuntu-latest
    env:
      ISSUE_PREFIX: ${{ vars.PROJECT_PREFIX }}
      IGNORE_PREFIX: ${{ vars.IGNORE_PREFIX }}
    steps:
      - name: Check branch name convention
        run: |
          BRANCH="${{ github.head_ref }}"
          # the normal dev -> main path and no-issue branches are skipped
          if [[ "$BRANCH" == "dev" || "$BRANCH" =~ ^${IGNORE_PREFIX} ]]; then
            echo "✅ '$BRANCH' – skipped."
            exit 0
          fi
          if ! [[ "$BRANCH" =~ ^(feature|bugfix|docs)/${ISSUE_PREFIX}-[0-9]+_.+ ]]; then
            echo "❗ Invalid branch name: $BRANCH"
            echo "   (feature|bugfix|docs)/${ISSUE_PREFIX}-<number>_description  or starting with '${IGNORE_PREFIX}'"
            exit 1
          fi
          echo "✅ Branch name OK: $BRANCH"

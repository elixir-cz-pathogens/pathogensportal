name: "CHECK: Backend ↔ DB integration"

# Backend integration tests against a real PostgreSQL (PP-12).
#
# Kept separate from _test-backend.yml because that file also gates both deploy
# workflows, and starting a database there would slow every deploy for no benefit.
# This runs only on PRs into `main`.
#
# The schema is taken from `pathogensportal-db/db/init.sql` in the submodule.
# Testing against a hand-copied schema would not detect drift between the two.
on:
  pull_request:
    branches: [main]

concurrency:
  group: backend-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: pathogens
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports:
          - 5432:5432
        # Without a health check the tests could start before Postgres accepts
        # connections and fail intermittently.
        options: >-
          --health-cmd "pg_isready -U portal -d pathogens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          # The schema lives in the submodule; the tests need it.
          submodules: true

      - name: Stop if the submodule schema is missing
        run: |
          if [ ! -f pathogensportal-db/db/init.sql ]; then
            echo "::error::pathogensportal-db/db/init.sql is missing — the submodule did not check out."
            echo "The schema must come from the submodule; there is nothing to test against."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -q -r backend/website-be/requirements.txt

      - name: Integration tests
        working-directory: backend/website-be
        env:
          PP_TEST_DB: "1"
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          POSTGRES_DB: pathogens
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: ci_only_not_a_secret
        run: |
          set -o pipefail
          pytest -q -m integration --junitxml=/tmp/integration.xml | tee /tmp/out.txt

      # Integration tests are skipped when PP_TEST_DB is unset, and a skipped
      # suite reports the same green as a passing one. This step fails the job
      # if no integration test actually ran (renamed marker, DB not started, ...).
      - name: Refuse to pass when no integration test actually ran
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse("/tmp/integration.xml").getroot()
          suite = r if r.tag == "testsuite" else r.find("testsuite")
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          ran = total - skipped
          print(f"integration tests: {total} collected, {skipped} skipped, {ran} actually ran")
          if ran < 1:
              print("::error::No integration test ran — refusing to report success.")
              sys.exit(1)
          PY

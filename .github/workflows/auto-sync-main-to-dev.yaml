name: "AUTOMATION: Sync main → dev"

# After every push to `main`, merges `main` back into `dev`.
#
# Changes can land on `main` without passing through `dev` (hotfixes, content PRs,
# workflow fixes). If `dev` is not realigned, the next `dev` -> `main` release can
# revert them, and a required check whose workflow file exists only on `main`
# never starts on a PR from `dev`.
#
# This file must live on `main`: for a `push` event GitHub reads the workflow
# definition from the branch being pushed, so a copy that exists only on `dev`
# never runs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge main into dev
        id: merge
        run: |
          set -euo pipefail
          git config user.name "pathogensportal sync"
          git config user.email "noreply@github.com"
          git checkout dev

          # Ask before merging whether `main` is already in `dev`; detecting an
          # empty merge afterwards (via the reflog) is fragile.
          if git merge-base --is-ancestor origin/main dev; then
            echo "result=nochange" >> "$GITHUB_OUTPUT"
          elif git merge origin/main --no-edit -m "no-issue: sync main → dev (${GITHUB_SHA::7})"; then
            git push origin dev
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            # Conflicts are not resolved automatically. A conflict in a template
            # or workflow needs a human decision, and a wrong automatic merge into
            # `dev` would be released later.
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Report
        run: |
          case "${{ steps.merge.outputs.result }}" in
            merged)   echo "✅ dev is aligned with main." ;;
            nochange) echo "ℹ️  dev already contains main, nothing to do." ;;
            conflict)
              echo "::error::Merge main → dev hit a conflict and was not performed."
              echo "Resolve it manually: git checkout dev && git merge origin/main"
              echo "Until then, dev is missing changes that are on main,"
              echo "including workflow files that required checks depend on."
              exit 1 ;;
          esac

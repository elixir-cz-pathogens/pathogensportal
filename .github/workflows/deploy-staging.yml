name: "Deploy: Staging (dev)"

# Enabled by the repo variable DEPLOY_STAGING_ENABLED == 'true'.
# Requires:
#   1) secret: STAGING_SSH_KEY   (the github-deploy private key for the staging machine)
#   2) vars:   STAGING_HOST      (FQDN of the staging machine, e.g. pathogens-dev.vm.cesnet.cz)
#              STAGING_PATH      (rsync target, see below)
#              STAGING_SSH_HOST_KEY (the server's pinned ssh-ed25519 host key)
#              DEPLOY_USER       (the account used for rsync, typically github-deploy)
#              DEPLOY_STAGING_ENABLED=true
# Deploy = test -> build Hugo from the `dev` branch -> rsync the static output to staging.
#
# The enable flag is per environment (DEPLOY_PRODUCTION_ENABLED is separate), so
# enabling staging can never arm a production deploy as a side effect.
#
# Staging and production have separate hosts and separate keys. A shared host
# would mean a push to `dev` deploys to production; a shared key would turn a
# compromised staging machine into access to production. Do not merge them.

on:
  push:
    branches: [dev]

# Serializes deploys. Concurrent runs write to separate release directories, but
# the final symlink flip would race: the last run to finish wins, which is not
# necessarily the newest commit. `dev` has more than one pusher (people and the
# data pipeline's machine commits), so this is a real case.
#
# `cancel-in-progress: false` is deliberate: a deploy that is already rsyncing
# must be allowed to finish. GitHub still cancels older queued runs, so the
# newest commit is the one that lands.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Unit tests gate the deploy: a red test never reaches the staging machine.
  # Reviewers are looking at this site to judge the release, so it must not be
  # able to show them a build whose backend tests are failing.
  tests:
    if: ${{ vars.DEPLOY_STAGING_ENABLED == 'true' }}
    uses: ./.github/workflows/_test-backend.yml

  deploy-staging:
    # `needs` is what makes it a gate rather than two things running side by side.
    # It also means that when the flag is off, `tests` is skipped and this is
    # skipped with it — one switch still controls the whole workflow.
    needs: tests
    if: ${{ vars.DEPLOY_STAGING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      # The hostname is not a secret (it is also in hugo.toml), so it is a `vars`
      # value: a masked secret would hide baseURL in the log and hinder debugging
      # of the SSH connection.
      STAGING_HOST: ${{ vars.STAGING_HOST }}
    steps:
      - name: Check deploy target is configured
        # Without this guard, an empty variable would produce baseURL "https:///"
        # and rsync would try to connect to "user@" — both fail incomprehensibly.
        run: |
          test -n "$STAGING_HOST" || {
            echo "::error::Missing repo variable STAGING_HOST (FQDN of the staging machine)."; exit 1; }
          test -n "${{ vars.STAGING_PATH }}" || {
            echo "::error::Missing repo variable STAGING_PATH (DocumentRoot on staging)."; exit 1; }

      - uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout only the Hugo theme submodule (not pathogensportal-db)
        run: |
          git submodule update --init -- frontend/themes/hugo-pathogens-portal
        # Only the theme is needed for the Hugo build. The -db submodule
        # contains scrapers and generators only used on the server; excluding
        # it keeps deploys fast and means -db can go private in the future
        # without breaking the deploy workflow.

      - uses: peaceiris/actions-hugo@v3
        with:
          # Pinned, not `latest`, so the build does not change when a new Hugo
          # release appears.
          hugo-version: '0.164.0'
          extended: true

      - name: Build (staging baseURL)
        working-directory: frontend
        # baseURL is derived from STAGING_HOST — the machine name lives in one place,
        # so a DNS change (a different provider, an own domain) is a variable change,
        # not a code change.
        run: hugo --minify --baseURL "https://${STAGING_HOST}/"

      - name: Deploy via rsync over SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # The host key is pinned rather than fetched with ssh-keyscan, which
          # trusts whatever answers on every run. With --delete, an impostor host
          # would not just receive the site, it would decide what the site becomes.
          # The key is public data, so it is a variable, not a secret.
          test -n "${{ vars.STAGING_SSH_HOST_KEY }}" || {
            echo "::error::Missing repo variable STAGING_SSH_HOST_KEY (value: the server's ssh-ed25519 line, see -priv ansible/known_hosts)."; exit 1; }
          printf '%s %s\n' "$STAGING_HOST" "${{ vars.STAGING_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          # No -a: it implies -p/-g/-t (permissions, groups, times). The target
          # directory is owned by `app` and the deploy account is only a member of
          # the `app` group, so it cannot chmod the directory and rsync would exit
          # with code 23 even though the files transfer.
          # Permissions are handled by setgid on the target directory (2775); rsync must
          # not transfer them.
          # StrictHostKeyChecking=yes is explicit: with the key pinned above there
          # is nothing to ask about, and a mismatch must stop the deploy.
          #
          # STAGING_PATH is `/` because the server pins this key to a forced
          # rrsync command. rrsync prefixes a leading-slash path with its
          # restricted directory, so `/` here means the jail root on the server.
          # The real path is set in the server configuration; changing one
          # without the other breaks the deploy.
          #
          # ── Release directories + a symlink flip ─────────────────────────
          #
          # Each deploy lands in its own directory and a symlink is then moved, so
          # visitors only ever see a complete tree, a truncated build cannot delete
          # live pages, and a rollback is `ln -sfn` on the server.
          REL="releases/${GITHUB_SHA}"

          # 1. the built site into its own directory. --delete is scoped to that
          #    directory, so it can never touch other releases or the symlink.
          rsync -rlvz --delete --no-perms --no-owner --no-group --omit-dir-times \
            -e "ssh -o StrictHostKeyChecking=yes" \
            frontend/public/ \
            "${{ vars.DEPLOY_USER }}@${STAGING_HOST}:${{ vars.STAGING_PATH }}${REL}/"

          # 2. the flip. rsync sends a symlink (-l), which is why no second
          #    credential is needed: rrsync passes symlinks through untouched
          #    (--munge-links is off), so the same write-only key that uploaded the
          #    release can point `current` at it.
          # No --delete here: at the jail root it would delete every release.
          mkdir -p .flip && ln -sfn "$REL" .flip/current
          rsync -rlvz --no-perms --no-owner --no-group --omit-dir-times \
            -e "ssh -o StrictHostKeyChecking=yes" \
            .flip/current \
            "${{ vars.DEPLOY_USER }}@${STAGING_HOST}:${{ vars.STAGING_PATH }}"

          echo "deployed $REL and pointed current at it"

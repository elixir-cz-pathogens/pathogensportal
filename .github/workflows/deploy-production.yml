name: "Deploy: Production (main)"

# 🔴 LIVE SINCE 17 AUG 2026. A merge into `main` DEPLOYS TO THE PUBLIC SITE.
#    `DEPLOY_PRODUCTION_ENABLED` is 'true'; exercised for real on 17 Aug and again
#    on 31 Aug (the rrsync jail change), both verified by the transfer list.
#    ⚠️ This header said "⛔ DISABLED" until 1 Sep 2026 — three weeks after it went
#    live. Read the repo variable, not this comment, and correct the comment when
#    you do: a file that lies about whether it touches production is worse than one
#    with no comment at all.
#
# Turning it OFF is `DEPLOY_PRODUCTION_ENABLED=false` — the whole workflow (tests
# included) is gated on it. Rule #1 still governs: production is not touched
# without the administrator's approval.
#
# Configuration, for a rebuild or a new machine:
#   1) secret: PRODUCTION_SSH_KEY   (the github-deploy private key FOR PRODUCTION —
#              generated separately; staging's key must never be reused here)
#   2) vars:   PRODUCTION_HOST      (FQDN of production, today pathogens.vm.cesnet.cz)
#              PRODUCTION_PATH      (see the rrsync note below — it is `/`, not a path)
#              PRODUCTION_SSH_HOST_KEY (the server's ssh-ed25519 line — public data)
#              DEPLOY_USER          (the account used for rsync, typically github-deploy)
#              DEPLOY_PRODUCTION_ENABLED=true
#
# ⚠️ THE FLAG IS PER ENVIRONMENT since 17 Aug 2026. It used to be a shared
#    DEPLOY_ENABLED, so enabling staging silently armed this workflow too. Deploying
#    to the live site is exactly the kind of action rule #1 exists to prevent from
#    happening as a side effect of someone else's decision.
# Deploy = after a merge into `main`, build Hugo -> rsync the static output to production.
#
# ⚠️ Staging and production DELIBERATELY have separate hosts and separate keys (they used
#    to share DEPLOY_HOST and DEPLOY_SSH_KEY). With two machines, a shared host would mean
#    a push to `dev` deploys to production; a shared key would turn a compromised staging
#    into access to production. Do not merge them back.
#
# ✅ The cutover HAPPENED on 17 Aug 2026. Production serves `main` from
#    /opt/pathogensportal/frontend/public. The old /var/www/pathogensportal tree is
#    not involved in any deploy.

on:
  push:
    branches: [main]

# ⛔ See the long note in deploy-staging.yml. Same reasoning, higher stakes: the
# rsync target here IS the live site's DocumentRoot, and two interleaved
# `--delete` transfers would take it apart while visitors are reading it.
#
# `cancel-in-progress: false`: never abort a transfer that has already started.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The same unit tests that gate staging. Production must not have a weaker gate
  # than the rehearsal environment.
  tests:
    if: ${{ vars.DEPLOY_PRODUCTION_ENABLED == 'true' }}
    uses: ./.github/workflows/_test-backend.yml

  deploy-production:
    needs: tests
    if: ${{ vars.DEPLOY_PRODUCTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      # The hostname is NOT a secret (it is also in hugo.toml) — deliberately `vars`,
      # not `secrets`: a masked value would break both baseURL in the log and any
      # debugging of ssh-keyscan.
      PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
    steps:
      - name: Check deploy target is configured
        # Without this guard, an empty variable would produce baseURL "https:///"
        # and rsync would try to connect to "user@" — both fail incomprehensibly.
        run: |
          test -n "$PRODUCTION_HOST" || {
            echo "::error::Missing repo variable PRODUCTION_HOST (FQDN of production)."; exit 1; }
          test -n "${{ vars.PRODUCTION_PATH }}" || {
            echo "::error::Missing repo variable PRODUCTION_PATH (DocumentRoot in production)."; exit 1; }

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: peaceiris/actions-hugo@v3
        with:
          # Pinned, not `latest`: 0.164 silently changed the content security
          # policy and broke the build. A build should not change under us.
          hugo-version: '0.164.0'
          extended: true

      - name: Build (production baseURL)
        working-directory: frontend
        # baseURL is derived from PRODUCTION_HOST — the machine name lives in one place.
        run: hugo --minify --baseURL "https://${PRODUCTION_HOST}/"

      - name: Deploy via rsync over SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # ⛔ NOT ssh-keyscan. A keyscan trusts whatever answers, on every run —
          # trust-on-first-use with no first use. Here the rsync target IS the
          # live DocumentRoot and the transfer uses --delete, so an impostor does
          # not just receive the site, it decides what the site becomes. The key
          # is public data, so it is a VARIABLE, not a secret, and can be checked
          # against ansible/known_hosts in the -priv repo.
          test -n "${{ vars.PRODUCTION_SSH_HOST_KEY }}" || {
            echo "::error::Missing repo variable PRODUCTION_SSH_HOST_KEY (value: the server's ssh-ed25519 line, see -priv ansible/known_hosts)."; exit 1; }
          printf '%s %s\n' "$PRODUCTION_HOST" "${{ vars.PRODUCTION_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          # MIND -a: it implies -p/-g/-t, i.e. transferring permissions, groups and times.
          # The target directory on the server is owned by `app`; the deploy account is
          # only a member of the `app` group — the kernel will not let it chmod someone
          # else's directory and rsync exits with code 23, even though the files transfer.
          # Verified in the lab on 19 Jul 2026.
          # Permissions are handled by setgid on the target directory (2775); rsync must
          # not transfer them.
          # StrictHostKeyChecking=yes is explicit: with the key pinned above there
          # is nothing to ask about, and a mismatch must stop the deploy.
          #
          # ✅ PRODUCTION_PATH is `/` since 31 Aug 2026, and that is CORRECT.
          # The forced rrsync command is applied on production
          # (users_deploy_restrict_rsync: true), and rrsync prefixes a
          # leading-slash client path with its restricted directory — so `/` here
          # resolves to /opt/pathogensportal/frontend/public there. The absolute
          # path would resolve to <dir><dir> and fail.
          # ⛔ The pair is COUPLED: the server switch and this variable change in
          # the same window, server first. Between the two steps the production
          # deploy is broken, and autodeploy is live — not a change to start and
          # walk away from. And verify with a deploy that actually TRANSFERS files:
          # a mis-prefixed jail still goes green while the site stays stale.
          rsync -rlvz --delete --no-perms --no-owner --no-group --omit-dir-times \
            -e "ssh -o StrictHostKeyChecking=yes" \
            frontend/public/ \
            "${{ vars.DEPLOY_USER }}@${PRODUCTION_HOST}:${{ vars.PRODUCTION_PATH }}/"

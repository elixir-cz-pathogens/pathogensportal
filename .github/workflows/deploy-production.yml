name: "Deploy: Production (main)"

# Deploy = after a merge into `main`: unit tests -> build Hugo -> rsync the static
# output to production.
#
# Runs only when the repo variable DEPLOY_PRODUCTION_ENABLED == 'true'.
# Requires:
#   1) secret: PRODUCTION_SSH_KEY   (the github-deploy private key for production —
#              generated separately; staging's key must never be reused here)
#   2) vars:   PRODUCTION_HOST      (FQDN of production)
#              PRODUCTION_PATH      (rsync target, see below)
#              PRODUCTION_SSH_HOST_KEY (the server's pinned ssh-ed25519 host key)
#              DEPLOY_USER          (the account used for rsync, typically github-deploy)
#              DEPLOY_PRODUCTION_ENABLED=true
#
# The enable flag is per environment (DEPLOY_STAGING_ENABLED is separate), so
# enabling staging can never arm a production deploy as a side effect.
#
# Staging and production have separate hosts and separate keys. A shared host
# would mean a push to `dev` deploys to production; a shared key would turn a
# compromised staging machine into access to production. Do not merge them.
#
# PRODUCTION_PATH is `/`. The deploy key is pinned to a forced rrsync command,
# and rrsync prefixes a leading-slash client path with its own restricted
# directory, so `/` here means the jail root on the server, not the filesystem
# root. Changing it and the server-side forced command is one change, server
# first: between the two steps the production deploy is broken.

on:
  push:
    branches: [main]

jobs:
  # The same unit tests that gate staging. Production must not have a weaker gate
  # than the rehearsal environment.
  tests:
    if: ${{ vars.DEPLOY_PRODUCTION_ENABLED == 'true' }}
    uses: ./.github/workflows/_test-backend.yml

  deploy-production:
    needs: tests
    if: ${{ vars.DEPLOY_PRODUCTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      # The hostname is not a secret (it is also in hugo.toml), so it is a `vars`
      # value: a masked secret would hide baseURL in the log and hinder debugging
      # of the SSH connection.
      PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
    steps:
      - name: Check deploy target is configured
        # Without this guard, an empty variable would produce baseURL "https:///"
        # and rsync would try to connect to "user@" — both fail incomprehensibly.
        run: |
          test -n "$PRODUCTION_HOST" || {
            echo "::error::Missing repo variable PRODUCTION_HOST (FQDN of production)."; exit 1; }
          test -n "${{ vars.PRODUCTION_PATH }}" || {
            echo "::error::Missing repo variable PRODUCTION_PATH (DocumentRoot in production)."; exit 1; }

      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout only the Hugo theme submodule (not pathogensportal-db)
        run: |
          git submodule update --init -- frontend/themes/hugo-pathogens-portal
        # Only the theme is needed for the Hugo build. The -db submodule
        # contains scrapers and generators only used on the server; excluding
        # it keeps deploys fast and means -db can go private in the future
        # without breaking the deploy workflow.

      - uses: peaceiris/actions-hugo@v3
        with:
          # Pinned, not `latest`, so the build does not change when a new Hugo
          # release appears.
          hugo-version: '0.164.0'
          extended: true

      - name: Build (production baseURL)
        working-directory: frontend
        # baseURL is derived from PRODUCTION_HOST — the machine name lives in one place.
        run: hugo --minify --baseURL "https://${PRODUCTION_HOST}/"

      - name: Deploy via rsync over SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # The host key is pinned rather than fetched with ssh-keyscan, which
          # trusts whatever answers on every run. With --delete, an impostor host
          # would not just receive the site, it would decide what the site becomes.
          # The key is public data, so it is a variable, not a secret.
          test -n "${{ vars.PRODUCTION_SSH_HOST_KEY }}" || {
            echo "::error::Missing repo variable PRODUCTION_SSH_HOST_KEY (value: the server's ssh-ed25519 line, see -priv ansible/known_hosts)."; exit 1; }
          printf '%s %s\n' "$PRODUCTION_HOST" "${{ vars.PRODUCTION_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          # No -a: it implies -p/-g/-t (permissions, groups, times). The target
          # directory is owned by `app` and the deploy account is only a member of
          # the `app` group, so it cannot chmod the directory and rsync would exit
          # with code 23 even though the files transfer. Permissions are handled by
          # setgid on the target directory (2775); rsync must not transfer them.
          # StrictHostKeyChecking=yes is explicit: with the key pinned above there
          # is nothing to ask about, and a mismatch must stop the deploy.
          #
          # ── Release directories + a symlink flip ─────────────────────────
          #
          # Each deploy lands in its own directory and a symlink is then moved, so
          # visitors only ever see a complete tree, a truncated build cannot delete
          # live pages, and a rollback is a symlink change on the server.
          #
          # Coupled to the server: the rrsync jail is the deploy area, so these
          # paths are relative to it (PRODUCTION_PATH stays "/"). The server side
          # is configured in the private infrastructure repository.
          REL="releases/${GITHUB_SHA}"

          # 1. the built site into its own directory. --delete is scoped there, so
          #    it can never touch another release or the live symlink.
          rsync -rlvz --delete --no-perms --no-owner --no-group --omit-dir-times \
            -e "ssh -o StrictHostKeyChecking=yes" \
            frontend/public/ \
            "${{ vars.DEPLOY_USER }}@${PRODUCTION_HOST}:${{ vars.PRODUCTION_PATH }}${REL}/"

          # 2. the flip — one rename, so visitors only ever see a complete tree.
          #    rsync sends a symlink (-l), so no second credential is needed:
          #    rrsync passes symlinks through untouched (--munge-links off).
          # No --delete here: at the jail root it would delete every release.
          mkdir -p .flip && ln -sfn "$REL" .flip/current
          rsync -rlvz --no-perms --no-owner --no-group --omit-dir-times \
            -e "ssh -o StrictHostKeyChecking=yes" \
            .flip/current \
            "${{ vars.DEPLOY_USER }}@${PRODUCTION_HOST}:${{ vars.PRODUCTION_PATH }}"

          echo "deployed $REL and pointed current at it"

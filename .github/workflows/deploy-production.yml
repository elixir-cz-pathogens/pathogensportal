name: "Deploy: Production (main)"

# ⛔ ZATÍM VYPNUTO. Job běží jen když je repo proměnná DEPLOY_ENABLED == 'true'.
# Zapnutí (až bude server + github-deploy ready):
#   1) nastavit secrets: DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER
#   2) nastavit vars:    PRODUCTION_PATH (DocumentRoot produkce), DEPLOY_ENABLED=true
# Deploy = po merge do `main` build Huga -> rsync statiky na produkci `pathogens.vm.cesnet.cz`.

on:
  push:
    branches: [main]

jobs:
  deploy-production:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build (production baseURL)
        working-directory: frontend
        run: hugo --minify --baseURL "https://pathogens.vm.cesnet.cz/"

      - name: Deploy via rsync over SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # POZOR na -a: zahrnuje -p/-g/-t, tedy přenos práv, skupin a časů.
          # Cílový adresář na serveru vlastní `app`, deploy účet je jen členem
          # skupiny `app` — chmod cizího adresáře mu jádro nedovolí a rsync skončí
          # s kódem 23, i když se soubory přenesou. Ověřeno v labu 19. 7. 2026.
          # Práva řeší setgid na cílovém adresáři (2775), rsync je přenášet nemá.
          rsync -rlvz --delete --no-perms --no-owner --no-group --omit-dir-times \
            frontend/public/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ vars.PRODUCTION_PATH }}/"

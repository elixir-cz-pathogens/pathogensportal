name: "CI: Backend Tests"

# Unit tests for the BE services (website-be, llm-agent-be, mcp) — ONLY on PRs into `main`.
#
# The steps themselves live in _test-backend.yml, because the same tests also gate
# the staging and production deploys. Keeping one definition means the PR check and
# the deploy gate can never disagree about what "tests pass" means.

on:
  pull_request:
    branches: [main]

# Superseded runs on the same PR are pointless — cancel them. Safe to cancel here
# in a way it is NOT safe in the deploy workflows: this job only builds, it never
# writes to a machine, so an aborted run leaves nothing half-finished.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    uses: ./.github/workflows/_test-backend.yml

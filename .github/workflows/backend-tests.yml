name: "CI: Backend Tests"

# Unit tests for the BE services (website-be, llm-agent-be, mcp) — ONLY on PRs into `main`.
on:
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pytest for each backend service
        run: |
          set -e
          found=0
          for svc in backend/*/; do
            [ -f "${svc}requirements.txt" ] || continue
            [ -d "${svc}tests" ] || continue
            found=1
            echo "::group::${svc}"
            pip install -q -r "${svc}requirements.txt"
            ( cd "$svc" && pytest -q )
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No BE services with tests were found."
          fi

name: "CHECK: Content Sanitizer"

# Fails a PR that puts executable or navigational markup into `frontend/content/`.
#
# Why this exists
# ---------------
# `hugo.toml` sets `allowContent = ['^text/markdown$', '^text/html$']`, so HTML in
# `content/` is rendered verbatim. That is safe for deliveries that go through
# `tools/ingest_report.py`, which sanitizes against an allowlist. Generated
# content PRs write `content/` directly and bypass the ingest, so this check
# enforces the same guarantee in CI.
#
# The pages are generated from external sources (WHO, ECDC, national health
# agencies, news), which makes them a prompt-injection surface: text embedded in
# a source page can lead a generator to emit a <script>. Human review focuses on
# subject-matter accuracy and is not a reliable way to spot such markup.
#
# Scope: the whole content tree, not just the PR's changed files. A full scan is
# cheap and cannot be bypassed by an unusual diff. Both stages are tested against
# planted samples, so they are known to be able to fail.
#
# The job name is flat and calls no reusable workflow, so the status reported to
# branch protection is exactly `content-sanitizer`. A caller job would report as
# `<job> / <called job>` and no longer match the required check name.
on:
  pull_request:
    branches: [main]

concurrency:
  group: content-sanitizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # No submodules: this reads `frontend/content/` only. The theme is not
        # scanned; it is reviewed separately and legitimately contains <script>.

      - name: Scan frontend/content for foreign markup
        run: |
          set -uo pipefail
          TARGET="frontend/content"

          if [ ! -d "$TARGET" ]; then
            echo "🚨 $TARGET does not exist — the scan would silently pass over nothing."
            exit 1
          fi

          # Guard against the "check that can only pass" failure mode: if the file
          # list is empty, something moved and this job must not report success.
          count=$(find "$TARGET" -type f \( -name '*.md' -o -name '*.html' \) | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "🚨 No .md/.html files found under $TARGET — refusing to pass vacuously."
            exit 1
          fi
          echo "ℹ️  Scanning $count content files under $TARGET"

          # ── Stage 1: <link>, which has exactly one legitimate form ──────────
          #
          # The generated report pages open with the report stylesheet:
          #
          #     <link rel="stylesheet" href="../../css/reports.css">     (cs/…)
          #     <link rel="stylesheet" href="../../../css/reports.css">  (en/…)
          #
          # A stylesheet in the body is a workaround: the theme does not load
          # reports.css itself. The exception is bounded: the shape is pinned to a
          # relative path ending in css/reports.css, so it can only reach
          # frontend/static/css/. An absolute or off-site href, a different file,
          # or any other rel= fails here.
          #
          # Do not relax this into a bare `<link`. `rel="import"`, `rel="prefetch"`
          # and a remote stylesheet are all real attack vectors, and a remote
          # stylesheet leaks every reader's IP address to its host.
          # The exception can be removed once the theme loads reports.css.
          LINK_OK='^[^:]+:[0-9]+:[[:space:]]*<link rel="stylesheet" href="(\.\./)+css/reports\.css">[[:space:]]*$'

          bad_links=$(grep -rEn --include='*.md' --include='*.html' '<link' "$TARGET" \
                      | grep -Ev "$LINK_OK" || true)

          if [ -n "$bad_links" ]; then
            echo ""
            echo "🚨 A <link> tag that is not the report stylesheet:"
            echo ""
            echo "$bad_links"
            echo ""
            echo "   The only <link> permitted in content is exactly:"
            echo '     <link rel="stylesheet" href="../../css/reports.css">'
            echo "   (with as many ../ as the page is deep). Page metadata belongs"
            echo "   in YAML front matter, never in a tag in the body."
            exit 1
          fi

          # ── Stage 2: everything that has no legitimate form at all ──────────
          #
          # Mirrors DROP_WITH_CONTENT, ALLOWED_ATTRS and SAFE_URL in
          # tools/ingest_report.py. Keep the two in step — if a tag is added there,
          # add it here.
          #
          #   executable      script / style / noscript / iframe / object / embed / form
          #   event handlers  onclick=, onerror=, onload=, …
          #   active URLs     javascript:, data:text/html, data:application/
          #   navigational    meta (http-equiv refresh), base
          #   svg             not in the ingest allowlist; can carry <script>
          PATTERN='<(script|style|noscript|iframe|object|embed|form|meta|base|svg)\b|[[:space:]]on[a-z]+[[:space:]]*=|javascript:|data:text/html|data:application/'

          hits=$(grep -rEnoi --include='*.md' --include='*.html' "$PATTERN" "$TARGET" || true)

          if [ -n "$hits" ]; then
            echo ""
            echo "🚨 Foreign markup found in content — this must never reach the site:"
            echo ""
            echo "$hits"
            echo ""
            echo "❗ frontend/content/ is rendered verbatim (hugo.toml: allowContent"
            echo "   permits text/html). Executable markup here runs on the public site."
            echo ""
            echo "   Charts belong in a shortcode reading /data/charts/*.json — never"
            echo "   inline JS. Page metadata belongs in YAML front matter — never in"
            echo "   a <meta> tag in the body."
            echo ""
            echo "   If a tag genuinely needs allowing, change it HERE and in"
            echo "   tools/ingest_report.py together, in the same PR, with a reason."
            exit 1
          fi

          echo "✅ No foreign markup in $count content files."

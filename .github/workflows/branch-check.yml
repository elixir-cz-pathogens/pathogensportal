name: branch-check

# Ověří, že název zdrojové větve PR odpovídá konvenci:
#   feat/<issue>-popis  |  bug/<issue>-popis  |  no-issue/popis  |  dev
# Bez externích závislostí.

on:
  pull_request:
    branches: [dev, main]

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          b="${{ github.head_ref }}"
          if [[ "$b" =~ ^((feat|bug)/[0-9]+(-[a-z0-9._-]+)?|no-issue/[a-z0-9._-]+|dev)$ ]]; then
            echo "ok: $b"
          else
            echo "::error::Neplatný název větve '$b'. Použij feat/<issue>-popis, bug/<issue>-popis nebo no-issue/popis."
            exit 1
          fi

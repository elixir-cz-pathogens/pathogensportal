name: "AUTOMATION: PR Open Notification"

# When a PR is opened, posts a comment into the matching issue (the number comes from the PR title).
on:
  pull_request:
    types: [opened]

env:
  IGNORE_PREFIX: ${{ vars.IGNORE_PREFIX }}
  PROJECT_PREFIX: ${{ vars.PROJECT_PREFIX }}

permissions:
  issues: write
  pull-requests: read

jobs:
  comment-on-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Comment PR opened on issue
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const ignore_prefix = process.env.IGNORE_PREFIX;
            if (pr.head.ref.startsWith(ignore_prefix)) {
              console.log(`Skipping '${pr.head.ref}' (${ignore_prefix}).`);
              return;
            }
            // Match only "<PROJECT_PREFIX>-<number>" as a whole word. A looser pattern
            // such as `\w+-\d+` also matches dates in titles ("update for 2026-09-04")
            // and would comment on an unrelated issue.
            const project_prefix = process.env.PROJECT_PREFIX;
            const match = pr.title.match(new RegExp(`\\b${project_prefix}-(\\d+)\\b`));
            if (match) {
              const issueNumber = match[1];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `PR [#${pr.number}](${pr.html_url}) opened from branch \`${pr.head.ref}\`.`
              });
            } else {
              console.log("No issue number in PR title — skipping.");
            }

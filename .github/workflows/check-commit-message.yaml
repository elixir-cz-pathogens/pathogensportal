name: "CHECK: Commit Message"

# Kontrola formátu commit zpráv — JEN na PR do `main` (dev je volný, bez kontrol).
# Platný formát:  <PROJECT_PREFIX>-<číslo>: zpráva    nebo    start <IGNORE_PREFIX>
#
# Commity převzaté z upstreamu (repo proměnná UPSTREAM_URL) se NEvalidují — jejich zprávy
# nemůžeme přepsat, aniž bychom rozbili merge, a spadlo by to při každém syncu.
# Konvence tak platí jen na commity, které píšeme my.
on:
  pull_request:
    branches: [main]

jobs:
  commit-message-check:
    runs-on: ubuntu-latest
    env:
      ISSUE_PREFIX: ${{ vars.PROJECT_PREFIX }}
      IGNORE_PREFIX: ${{ vars.IGNORE_PREFIX }}
      UPSTREAM_URL: ${{ vars.UPSTREAM_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages (main..HEAD, bez upstreamu)
        run: |
          git fetch origin main:main || true

          # Větve upstreamu → refs/remotes/upstream/*; z kontroly je pak vyjmeme přes `--not`.
          # Bez UPSTREAM_URL (nebo když fetch selže) se kontroluje celý rozsah main..HEAD.
          upstream_refs=""
          if [ -n "${UPSTREAM_URL:-}" ]; then
            if git fetch --no-tags --quiet "$UPSTREAM_URL" "+refs/heads/*:refs/remotes/upstream/*"; then
              upstream_refs=$(git for-each-ref --format="%(refname)" refs/remotes/upstream/ | grep -v HEAD)
              echo "ℹ️  Upstream commity se nevalidují (${UPSTREAM_URL})."
            else
              echo "⚠️  Upstream ${UPSTREAM_URL} se nepodařilo fetchnout — kontroluji celý rozsah."
            fi
          fi

          invalid=$(git log --no-merges --format="%s" main..HEAD --not $upstream_refs \
            | grep -vE "^(${IGNORE_PREFIX}|${ISSUE_PREFIX}-[0-9]+: .+)" || true)
          if [ -n "$invalid" ]; then
            echo "🚨 Neplatné commit zprávy:"
            echo "$invalid"
            echo "❗ Očekávám '${ISSUE_PREFIX}-<číslo>: zpráva' nebo start '${IGNORE_PREFIX}'"
            exit 1
          fi
          echo "✅ Všechny commit zprávy jsou v pořádku."

name: "AUTOMATION: Branch Issue Linker"

# On a push to a feature/bugfix/docs branch, posts a comment (once) into the matching issue.
on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'docs/**'

permissions:
  issues: write

jobs:
  notify-issue-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Notify issue about branch
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const prefix = "${{ vars.PROJECT_PREFIX }}";
            const match = branch.match(new RegExp(`^(feature|bugfix|docs)/${prefix}-(\\d+)_.*`));
            if (match) {
              const issueNumber = match[2];
              const user = context.actor;
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              const branchMention = `Branch **${branch}** created and pushed by @${user}`;
              if (!comments.some(c => c.body.includes(branchMention))) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `${branchMention}. Work in progress!`,
                });
              }
            }

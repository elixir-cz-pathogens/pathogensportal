name: "AUTOMATION: PR Merged Notification"

# When a PR is merged, posts a comment into the matching issue.
on:
  pull_request:
    types: [closed]

env:
  IGNORE_PREFIX: ${{ vars.IGNORE_PREFIX }}
  PROJECT_PREFIX: ${{ vars.PROJECT_PREFIX }}

permissions:
  issues: write
  pull-requests: read

jobs:
  comment-on-issue:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Comment PR merged on issue
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const ignore_prefix = process.env.IGNORE_PREFIX;
            if (pr.head.ref.startsWith(ignore_prefix)) {
              console.log(`Skipping '${pr.head.ref}' (${ignore_prefix}).`);
              return;
            }
            // ⚠️ The issue number is matched against PROJECT_PREFIX, not `\w+`. It used to be
            // `/(\w+-\d+)/`, which has no anchor and no prefix constraint — so ANY word-digit
            // pair in a PR title looked like an issue reference. PR #49
            // ("content: Ebola dashboard update for 2026-09-04") matched `2026-09` and the
            // automation posted onto issue #9, a live and unrelated backend ticket.
            // Content PRs are titled "... for YYYY-MM-DD" BY CONVENTION, so this fired on every
            // one of them, twice (on open and again on merge).
            const project_prefix = process.env.PROJECT_PREFIX;
            const match = pr.title.match(new RegExp(`\\b${project_prefix}-(\\d+)\\b`));
            if (match) {
              const issueNumber = match[1];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `PR [#${pr.number}](${pr.html_url}) merged! 🎉`
              });
            } else {
              console.log("No issue number in PR title — skipping.");
            }

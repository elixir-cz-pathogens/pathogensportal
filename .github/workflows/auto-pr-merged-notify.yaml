name: "AUTOMATION: PR Merged Notification"

# When a PR is merged, posts a comment into the matching issue.
#
# A merge into `dev` also labels the issue `on-staging` (TODO I39): `Closes #N`
# only fires on the default branch, so issues of feature PRs never closed.
# auto-release-closes-issues.yaml turns every open `on-staging` issue into a
# `Closes #N` line on the release PR, so an issue closes when its work reaches
# PRODUCTION, not when it reaches staging.
on:
  pull_request:
    types: [closed]

env:
  IGNORE_PREFIX: ${{ vars.IGNORE_PREFIX }}
  PROJECT_PREFIX: ${{ vars.PROJECT_PREFIX }}

permissions:
  issues: write
  pull-requests: read

jobs:
  comment-on-issue:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Comment PR merged on issue
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const ignore_prefix = process.env.IGNORE_PREFIX;
            if (pr.head.ref.startsWith(ignore_prefix)) {
              console.log(`Skipping '${pr.head.ref}' (${ignore_prefix}).`);
              return;
            }
            // Match only "<PROJECT_PREFIX>-<number>" as a whole word. A looser pattern
            // such as `\w+-\d+` also matches dates in titles ("update for 2026-09-04")
            // and would comment on an unrelated issue.
            const project_prefix = process.env.PROJECT_PREFIX;
            const match = pr.title.match(new RegExp(`\\b${project_prefix}-(\\d+)\\b`));
            if (match) {
              const issueNumber = Number(match[1]);
              const toDev = pr.base.ref === "dev";
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: toDev
                  ? `PR [#${pr.number}](${pr.html_url}) merged into \`dev\` — on staging now. ` +
                    `This issue closes with the next release to production.`
                  : `PR [#${pr.number}](${pr.html_url}) merged! 🎉`
              });
              if (toDev) {
                // Create the label on first use; 422 = it exists already.
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner, repo: context.repo.repo,
                    name: "on-staging", color: "fbca04",
                    description: "Merged into dev; closes when released to production",
                  });
                } catch (e) { if (e.status !== 422) throw e; }
                await github.rest.issues.addLabels({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issueNumber, labels: ["on-staging"],
                });
              }
            } else {
              console.log("No issue number in PR title — skipping.");
            }

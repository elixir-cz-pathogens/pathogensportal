name: "CHECK: No Content Regression"

# Fails a PR into `main` that would REPLACE PUBLISHED CONTENT WITH OLDER CONTENT.
#
# Why this exists
# ---------------
# Content can reach `main` directly (Ebola content PRs, hotfixes) while `dev` runs
# ahead on everything else. If `dev` is not realigned, a `dev` -> `main` merge can
# replace published pages and chart files with older versions. Nothing else
# catches this: `hugo-build` builds older data without complaint,
# `content-sanitizer` reads markup rather than dates, and in a large release diff
# a single older number is easy to miss in review.
#
# Why not simply "main must not be ahead of the branch"
# -----------------------------------------------------
#   Too strict: PRs into `main` do not only come from `dev`. A content PR is
#   behind `main` as soon as any release lands, and would be blocked even though
#   it harms nothing.
#
#   Too weak: being level with `main` proves nothing about the result. Resolving
#   a merge conflict toward the older side leaves the branch up to date while
#   still publishing older content.
#
# So the check reads the merge result (what this PR would put on production) and
# compares its dates and versions against what production serves today. Topology
# is reported for context only.
#
# What counts as a regression
# ---------------------------
# Only monotonic facts, so that a legitimate change cannot trip it:
#   * `update_freq: … · v84 · …` on the Ebola pages — the generator's own version
#   * `posledni_datum` in a chart file — how far the data reaches
#   * `generated_at` in a chart file — when the pipeline ran
#
# Series length is reported, not enforced. `flu_weekly` holds one season and
# resets to a single point every autumn; a "never shorter" rule would fail every
# October on a correct file.
#
# An intended rollback (bad data withdrawn) will fail here; that should take a
# deliberate act. `enforce_admins` is off on this repo, so an admin can merge past
# it, and the failure text says so.
#
# The job name is flat and calls no reusable workflow, so the status reported to
# branch protection is exactly `no-content-regression`. A caller job would report
# as `<job> / <called job>` and no longer match the required check name.
#
# Make this check required only after it has reported on a real PR: a required
# check that has never run looks the same as one that is stuck.

on:
  pull_request:
    branches: [main]

concurrency:
  group: no-content-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-content-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the job diffs the merge result against origin/main, and a
          # shallow clone has no origin/main to diff against.
          fetch-depth: 0
          # No submodules — this reads frontend/content and frontend/static/data only.

      - name: Compare the merge result against what production serves
        run: |
          set -euo pipefail
          # Explicit refspec. `actions/checkout` configures remote.origin.fetch
          # for the ref it checked out — for a PR that is the merge ref — so a bare
          # `git fetch origin main` can update FETCH_HEAD and leave `origin/main`
          # nonexistent. The script would then find no base for any file.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          git rev-parse --verify --quiet origin/main >/dev/null || {
            echo "🚨 origin/main did not resolve after fetching it — refusing to guess."
            exit 1
          }
          echo "ℹ️  Base: origin/main ($(git rev-parse --short origin/main))"
          echo "ℹ️  This PR would publish the tree checked out here ($(git rev-parse --short HEAD))"
          echo ""
          behind=$(git rev-list --count HEAD..origin/main)
          if [ "$behind" -gt 0 ]; then
            echo "ℹ️  main has $behind commit(s) this branch does not contain."
            echo "    That is context, not a verdict — the comparison below decides."
            echo ""
          fi
          python3 .github/scripts/check_no_content_regression.py

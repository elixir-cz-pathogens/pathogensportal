name: "CI: Hugo Build"

# Verifies that the site builds. Runs only on PRs into `main`.
on:
  pull_request:
    branches: [main]

# Superseded runs on the same PR are pointless — cancel them. Safe to cancel here
# in a way it is not safe in the deploy workflows: this job only builds, it never
# writes to a machine, so an aborted run leaves nothing half-finished.
concurrency:
  group: hugo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hugo-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive    # the Hugo theme is a git submodule
          fetch-depth: 0

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned, not `latest`, so the build does not change when a new Hugo
          # release appears.
          hugo-version: '0.164.0'
          extended: true

      - name: Build site
        working-directory: frontend
        run: hugo --minify

name: "CI: Hugo Build"

# A real check — verifies the site builds at all. ONLY on PRs into `main`.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hugo-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive    # the Hugo theme is a git submodule
          fetch-depth: 0

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          # Pinned, not `latest`: 0.164 silently changed the content security
          # policy and broke the build. A build should not change under us.
          hugo-version: '0.164.0'
          extended: true

      - name: Build site
        working-directory: frontend
        run: hugo --minify

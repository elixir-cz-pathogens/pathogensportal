name: "CI: Hugo Build"

# A real check — verifies the site builds at all. ONLY on PRs into `main`.
on:
  pull_request:
    branches: [main]

# Superseded runs on the same PR are pointless — cancel them. Safe to cancel here
# in a way it is NOT safe in the deploy workflows: this job only builds, it never
# writes to a machine, so an aborted run leaves nothing half-finished.
concurrency:
  group: hugo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hugo-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive    # the Hugo theme is a git submodule
          fetch-depth: 0

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned, not `latest`: 0.164 silently changed the content security
          # policy and broke the build. A build should not change under us.
          hugo-version: '0.164.0'
          extended: true

      - name: Build site
        working-directory: frontend
        run: hugo --minify

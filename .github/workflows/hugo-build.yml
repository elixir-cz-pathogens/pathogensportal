name: "CI: Hugo Build"

# A real check — verifies the site builds at all. ONLY on PRs into `main`.
on:
  pull_request:
    branches: [main]

jobs:
  hugo-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive    # the Hugo theme is a git submodule
          fetch-depth: 0

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned, not `latest`: 0.164 silently changed the content security
          # policy and broke the build. A build should not change under us.
          hugo-version: '0.164.0'
          extended: true

      - name: Build site
        working-directory: frontend
        run: hugo --minify
